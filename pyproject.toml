[project]
name = "svs"
version = "0.1.0"
description = "Speaker verification service: embeddings, calibrated scoring, profiles, 1:N search"
readme = "README.md"
requires-python = ">=3.11"
# Runtime dependencies are added on the day they are first used (audio/VAD on D2, ONNX model on D3).
dependencies = [
    "kaldi-native-fbank>=1.22.3",
    "numpy>=1.26",
    "onnxruntime>=1.30.0",
    "scipy>=1.11",
    "soundfile>=0.12",
    "webrtcvad-wheels>=2.0.14",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/svs"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
