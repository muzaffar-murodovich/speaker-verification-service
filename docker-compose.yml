services:
  qdrant:
    image: qdrant/qdrant:v1.19.2
    ports:
      - "6333:6333"  # REST
      - "6334:6334"  # gRPC
    volumes:
      - qdrant-storage:/qdrant/storage

  svs:
    build: .
    ports:
      - "8000:8000"
    environment:
      CFG_SV_QDRANT_URL: http://qdrant:6333
      CFG_SV_AUDIO_ROOT: /app/data
    volumes:
      # Downloaded on the host (make model); read-only in the container.
      - ./artifacts/models:/app/artifacts/models:ro
      # /v1/embed reads audio_uri paths under here, e.g. voxceleb1/wav/id10001/....wav
      - ./data:/app/data:ro
    depends_on:
      - qdrant

volumes:
  qdrant-storage:
